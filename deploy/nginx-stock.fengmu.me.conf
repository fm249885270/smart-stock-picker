# 智能选股 - stock.fengmu.me
# 放置到 /etc/nginx/conf.d/stock.fengmu.me.conf
server {
    listen 80;
    listen [::]:80;
    server_name stock.fengmu.me;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 如需只给自己使用，取消下面 3 行注释并创建密码文件：
    # auth_basic "智能选股";
    # auth_basic_user_file /etc/nginx/.muge-tool.htpasswd;
    # location /api/health { auth_basic off; proxy_pass http://127.0.0.1:8787; }
}